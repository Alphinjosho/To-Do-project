 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO</title>
    <link rel="stylesheet" href="Style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
 </head>
 <body>
   <div class="container">
         <div class="d-flex"> 
                <div class="Box1">
                   <h1 id="UFinished">Un-Finished task</h1>
                    <p class="motiv1">"Winners never quit, and quitters never win"</p>
                     <div id="Tasks">   </div>
               </div>   
                  <div class="Box2">
                     <h1 id="addTask"> Add Task </h1>
                     <p class="motiv">"Time is your most valuable asset. Use it wisely with this to-do list."</p>
                     <input id="add" placeholder="Add Tasks">
                     <button id="display" onclick="formValidation()">SUBMIT</button>
                     <p id="Perror">Please enter your task & achieve your goal!!!</p>
                  </div>

                  <div class="Box3">
                     <h1 id="Finished">Finished Tasks</h1>
                     <p class="motiv3">"Great things are done by a series of small things"</p>
                     <div id="ResultBoxs">  </div>
                  </div>
               </div>
          </div>
 </body>
 <script src="To-do.js"></script>
 </html>
